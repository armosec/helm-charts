# Grants the nodes/list permission to the storage ServiceAccount so host SBOM
# and ContainerProfile cleanup can retain resources while their owner Node exists.
# Upstream OSS kubescape-operator PR #933 adds this to the storage ClusterRole
# (see https://github.com/kubescape/helm-charts/pull/933); until upstream merges
# and releases it, it is granted here as a separate, additive ClusterRole.
{{- $ksValues := index .Values "kubescape-operator" }}
{{- $components := fromYaml (include "components" (dict "Values" $ksValues)) }}
{{- if $components.storage.enabled }}
{{- $storageName := $ksValues.storage.name }}
{{- $ksNamespace := $ksValues.ksNamespace }}
{{- $chart := dict "Name" .Chart.Name "Version" (.Chart.Version | replace "+" "_") "AppVersion" (.Chart.AppVersion | replace "+" "_") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $storageName }}-node-discovery
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" $ksValues) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" $chart "Release" .Release "Values" $ksValues "app" $storageName "tier" $ksValues.global.namespaceTier) | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $storageName }}-node-discovery
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" $ksValues) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" $chart "Release" .Release "Values" $ksValues "app" $storageName "tier" $ksValues.global.namespaceTier) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ $storageName }}
  namespace: {{ $ksNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $storageName }}-node-discovery
{{- end }}

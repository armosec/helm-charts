suite: Storage RBAC tests
templates:
  - templates/storage-node-discovery-rbac.yaml
tests:
  - it: allows listing nodes to retain host resources while their nodes exist
    set:
      kubescape-operator:
        unittest: true
        clusterName: kind-kind
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["list"]
        documentIndex: 0

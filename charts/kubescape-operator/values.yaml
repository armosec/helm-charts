kubescape-operator:
  alertCRD:
    installDefault: false
  capabilities:
    manageWorkloads: enable
    nodeProfileService: enable
    runtimeDetection: enable
  excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,kubeconfig,gmp-system,gmp-public,cortex-agent"
  imagePullSecret:
    server: quay.io
    username: armosec+armosec_ro
  imagePullSecrets: armosec-readonly
  hostScannerCleanup:
    image:
      repository: quay.io/kubescape/kubectl
      tag: 1.36.1
      pullPolicy: IfNotPresent
    nodeSelector: {}
    affinity: {}
    tolerations: []
    priorityClassName: ""
  kubevuln:
    sbomScanner:
      enabled: true
  nodeAgent:
    # GKE Autopilot: correct allowlist for this distribution (quay.io/armosec node-agent).
    # Opt-in — enable on Autopilot clusters with:
    #   --set kubescape-operator.nodeAgent.gke.allowlist.enabled=true
    gke:
      allowlist:
        name: armo-private-node-agent-1.40-v2
    autoscaler:
      enabled: true
    config:
      extra:
        hostMalwareSensorEnabled: false
        hostNetworkSensorEnabled: false
        # AI-Sandbox HTTP-capture tap, NA-3 workload scanner, and TLS tracing (ADR 0009:
        # adrs/0009-node-agent-capture-config-rename-and-otel-filter.md in armosec/shared-designs-and-docs).
        #
        # Image tag notice: This chart pins nodeAgent.image.tag: v0.0.386, which predates
        # the ADR 0009 rename. In v0.0.386, the active keys remain the legacy names:
        #   sslTracingEnabled: true (also goTlsTracingEnabled, sslOffsetAttachEnabled)
        #   httpCaptureConfigPollEnabled: true
        # Once upgraded to an agent image containing ADR 0009, use the renamed keys below:
        #
        # - tlsTracingEnabled: Static, local-only switch (ADR 0009 §1). Setting this immediately
        #   enables fleet-wide TLS decryption (attaches libssl gadget, Go TLS gadget, and
        #   offset-attach path) at node-agent startup. Revocable only by node-agent rollout.
        #
        # - captureConfigPollEnabled: Dynamic backend-authorized switch (ADR 0009 §5 & §6).
        #   Enables polling the backend to query whether HTTP capture tap and NA-3 workload
        #   scanning are authorized. Requires OTEL_EVENTS_EXPORTER_ENDPOINT set in
        #   nodeAgent.env. Fail-closed: if enabled and the backend is unreachable, it results
        #   in deny-all.
        #
        # In this chart, pass them via nodeAgent.config.extra:
        #   --set kubescape-operator.nodeAgent.config.extra.tlsTracingEnabled=true
        #   --set kubescape-operator.nodeAgent.config.extra.captureConfigPollEnabled=true
        #
        # tlsTracingEnabled: true
        # captureConfigPollEnabled: true
    env:
      - name: IGNORERULEBINDINGS
        value: true
    image:
      repository: quay.io/armosec/node-agent
      tag: v0.0.386
    resources:
      limits:
        memory: 1000Mi
    sbomScanner:
      enabled: true
      image:
        repository: quay.io/armosec/node-agent
  operator:
    rulesUpdateConfig:
      enabled: true
      interval: 5m

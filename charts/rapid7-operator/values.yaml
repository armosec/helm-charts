kubescape-operator:
  alertCRD:
    installDefault: false
  capabilities:
    manageWorkloads: enable
    nodeProfileService: enable
    nodeSbomGeneration: disable
    runtimeDetection: enable
    configurationScan: disable
    vulnerabilityScan: disable
    seccompProfileBackend: crd
  excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,kubeconfig,gmp-system,gmp-public,cortex-agent"
  imagePullSecret:
    server: quay.io
    username: armosec+armosec_ro
  imagePullSecrets: armosec-readonly
  kubevuln:
    sbomScanner:
      enabled: true
  nodeAgent:
    # GKE Autopilot: correct allowlist for this distribution (quay.io/armosec node-agent).
    # Opt-in — enable on Autopilot clusters with:
    #   --set kubescape-operator.nodeAgent.gke.allowlist.enabled=true
    gke:
      allowlist:
        name: armo-rapid7-node-agent-1.40-v2
    autoscaler:
      enabled: true
    config:
      extra:
        backendStorageEnabled: true
        hostMalwareSensorEnabled: false
        hostNetworkSensorEnabled: false
    env:
      - name: IGNORERULEBINDINGS
        value: true
    image:
      repository: quay.io/armosec/node-agent
      tag: v0.0.386
    resources:
      limits:
        memory: 1000Mi
  operator:
    rulesUpdateConfig:
      enabled: true
      interval: 5m
  storage:
    # Rapid7 uses backend-storage (nodeAgent.config.extra.backendStorageEnabled=true) and does not
    # run the in-cluster storage aggregated APIServer. Base chart <=1.40.2 derived this implicitly
    # (storage.enabled = not backendStorageEnabled); 1.40.3 replaced that with an explicit
    # storage.enabled defaulting to true, so it must be pinned here to keep the R7 footprint
    # unchanged. The gate lives in the upstream dependency chart, not this repo -- see the
    # "components" define in charts/kubescape-operator/templates/_common.tpl at
    # https://github.com/kubescape/helm-charts.
    enabled: false
